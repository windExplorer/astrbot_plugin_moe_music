name: astrbot_plugin_moe_music
display_name: 萌音点歌
desc: 连接自建 lx_music_api 音源后端的点歌插件，支持 QQ 音乐卡片、多模式降级发送、歌词图片、AI 自然语言点歌与歌曲分享自动识别。
version: v1.0.1
author: windExplorer
repo: https://github.com/windExplorer/astrbot_plugin_moe_music.git
help: 指令：点歌 <歌名> [序号]；点歌文件 / 下载 <歌名> [序号]（下载音乐文件并内嵌封面与歌词，音质单独配置）；网易点歌 / QQ点歌 / 酷狗点歌 / 酷我点歌 / 咪咕点歌 <歌名>（加「文件」后缀即为文件下载版）；查歌词 / 歌词 <歌名>；点歌自检。也可对 AI 说“放一首 xx 的歌”自动点歌。点歌后会先发一张歌曲信息卡片（封面/歌名/歌手/时长，可补年份、热评与 AI 歌手简介，可关）。引用别人的 QQ音乐 / 网易云 / 酷狗 / 酷我 分享再发「点歌」「下载」或「歌词」，即可直接播放 / 下载文件 / 查那首歌的歌词；开启「分享卡片自动识别」（默认关闭）后，群里有人分享这类歌曲会自动发语音。
pages:
  - name: moe-console
    title: 萌音控制台
